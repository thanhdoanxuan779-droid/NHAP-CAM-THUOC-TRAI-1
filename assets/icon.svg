<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Sổ nhập cám và thuốc</title>
  <desc id="desc">Quyển sổ xanh kết hợp bao cám và viên thuốc</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#113f2a"/><stop offset="1" stop-color="#32845c"/></linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2e8a5d"/><stop offset="1" stop-color="#155338"/></linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffef8"/><stop offset="1" stop-color="#e5f0e5"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="13" stdDeviation="12" flood-color="#062b1b" flood-opacity=".4"/></filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="255" r="200" fill="#fff" opacity=".07"/>
  <g filter="url(#shadow)">
    <!-- notebook -->
    <path d="M94 93h285c17 0 30 13 30 30v313H124c-17 0-30-13-30-30V93Z" fill="url(#cover)" stroke="#8bc878" stroke-width="8"/>
    <path d="M127 112h235c13 0 23 10 23 23v267H142c-13 0-23-10-23-23V136c0-13 0-24 8-24Z" fill="url(#page)" stroke="#d0e5d1" stroke-width="7"/>
    <path d="M120 145h265" stroke="#b7d8bb" stroke-width="5"/>
    <path d="M146 176h215M146 194h170" stroke="#b8d5bc" stroke-width="6" stroke-linecap="round" opacity=".8"/>
    <text x="250" y="153" text-anchor="middle" fill="#18583c" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="900" letter-spacing="2">SỔ NHẬP</text>
    <!-- feed badge -->
    <g transform="translate(143 221)">
      <path d="M0 20 28 4h65l28 16-7 103H7L0 20Z" fill="#edc348" stroke="#c38c28" stroke-width="5"/>
      <path d="M0 20 60 40l61-20" fill="none" stroke="#fff0a0" stroke-width="5"/>
      <path d="M30 5c4-11 10-16 18-16s14 5 18 16" fill="none" stroke="#fff1a4" stroke-width="7" stroke-linecap="round"/>
      <text x="61" y="79" text-anchor="middle" fill="#18583c" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="900">CÁM</text>
      <path d="M41 95c8-12 14-12 20 0 7-12 13-12 20 0" fill="none" stroke="#fff0a0" stroke-width="5"/>
    </g>
    <!-- medicine badge -->
    <g transform="translate(266 233)">
      <circle cx="61" cy="62" r="56" fill="#e9f3fb" stroke="#2868a5" stroke-width="7"/>
      <g transform="rotate(-35 61 62)"><rect x="18" y="28" width="86" height="68" rx="34" fill="#fff" stroke="#2868a5" stroke-width="7"/><path d="M61 30v64" stroke="#2868a5" stroke-width="7"/><path d="M21 62h40v34h-5a35 35 0 0 1-35-34Z" fill="#55a2df"/></g>
      <text x="61" y="139" text-anchor="middle" fill="#2868a5" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="900">THUỐC</text>
    </g>
    <rect x="145" y="385" width="216" height="35" rx="17" fill="#18583c"/>
    <text x="253" y="410" text-anchor="middle" fill="#eff9c5" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="900" letter-spacing="2">CÁM + THUỐC</text>
    <!-- notebook rings -->
    <path d="M105 142v35M105 207v35M105 272v35M105 337v35" stroke="#d6efa0" stroke-width="12" stroke-linecap="round"/>
  </g>
  <circle cx="414" cy="91" r="30" fill="#e5effb"/>
  <path d="M414 75v32M398 91h32" stroke="#2868a5" stroke-width="8" stroke-linecap="round"/>
</svg>
