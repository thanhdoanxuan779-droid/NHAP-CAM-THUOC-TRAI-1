<style>

e-wrap{width:100%;overflow:hidden}table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:11px}th,td{border:1px solid var(--grid);text-align:center;vertical-align:middle;padding:4px 2px;overflow:hidden}.date-cell{position:relative;height:40px}.date-display{display:flex;align-items:center;justify-content:center;width:100%;height:36px;color:#34423a;font:inherit;pointer-events:none;white-space:nowrap}.date-cell [data-date-input]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;margin:0;padding:0}th{background:var(--green-bg);height:48px;font-size:10px;font-weight:800;line-height:1.2;overflow-wrap:anywhere}.med th{background:var(--blue-bg)}td{height:44px;background:#fff}.stt-cell{position:relative}td input,td select{display:block;width:100%;max-width:100%;min-width:0;height:36px;border:0;border-radius:0;background:transparent;padding:4px 2px;margin:0;font:inherit;color:#34423a;text-align:center;outline:none;appearance:auto}td input:focus,td select:focus{background:transparent;box-shadow:none;outline:none}td.name input {

}td input[type=date]{font-size:10px;padding:2px 0}td input[type=number]{appearance:textfield;-moz-appearance:textfield}td input[type=number]::-webkit-inner-spin-button{appearance:none}.med .sheet{--green-line:var(--blue-line)}.med .sheet-title{border-bottom-color:var(--blue-line)}.med th{border-color:var(--grid)}.hidden{display:none!important}@media(min-width:700px){.app-head, .month-box,.tabs,main{max-width:900px;margin-left:auto;margin-right:auto}.app-head{padding-top:22px}.brand h1{font-size:26px}main{padding-left:14px;padding-right:14px}table{font-size:13px}th{font-size:12px}.sheet-title h2{font-size:30px}.sheet-title p{font-size:15px}.period{font-size:15px}td input,td select{font-size:13px}}@media print{.app-head,.month-box,.tabs{display:none}body{padding:0;background:#fff}main{padding:0}.sheet{border-radius:0}table{font-size:10px}}
.hidden{display:none!important}</style></head><body>
<header class="app-head"><div class="brand"><h1>SỔ NHẬP CÁM &amp; THUỐC</h1><p>Theo dõi hàng nhập hằng ngày · Trại gà bố mẹ</p></div><button class="menu-btn" id="menuBtn" aria-label="Menu" title="Menu">☰</button></header>
<div class="tabs"><button id="topFeed" class="tab active feed">Nhập cám</button><button id="topMed" class="tab">Nhập thuốc</button></div>
<main>
<section id="feedSheet" class="sheet"><div class="sheet-title"><h2>BẢNG NHẬP CÁM</h2><p>Theo dõi số lượng cám nhập hằng ngày</p></div><div class="table-wrap"><table><colgroup><col style="width:6%"><col style="width:27%"><col style="width:27%"><col style="width:20%"><col style="width:20%"></colgroup><thead><tr><th>STT</th><th>Ngày nhập</th><th>Tên cám</th><th>Loại cám</th><th>Số lượng</th></tr></thead><tbody id="feedRows"></tbody></table></div></section>
<section id="medSheet" class="sheet med hidden"><div class="sheet-title"><h2>BẢNG NHẬP THUỐC</h2><p>Theo dõi số lượng thuốc nhập hằng ngày</p></div><div class="table-wrap"><table><colgroup><col style="width:6%"><col style="width:27%"><col style="width:27%"><col style="width:20%"><col style="width:20%"></colgroup><thead><tr>
  <th>STT</th>
  <th>Ngày nhập</th>
  <th>Tên thuốc</th>
  <th>Số lượng</th>
  <th>Quy cách đóng gói</th>
</tr></thead><tbody id="medRows"></tbody></table></div></section>
</main>
<div id="menuPanel" class="menu-panel hidden" role="dialog" aria-modal="true" aria-label="Công cụ"><div class="menu-card"><h3 id="menuTitle">Công cụ nhập cám</h3><button id="saveCloudBtn">☁️ Lưu dữ liệu nhập cám lên máy chủ</button><button id="loadCloudBtn">↻ Tải dữ liệu nhập cám từ máy chủ</button><button id="exportPdfBtn">📄 Xuất PDF độ nét cao và chia sẻ</button><button id="closeMenuBtn" class="close-menu">Đóng</button></div></div><div id="toast" class="toast hidden" role="status" aria-live="polite"></div>


<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);
  const KEY = 'so_nhap_cam_thuoc_minimal_v4';
  const WORKER_URL =
    'https://nhapcamthuoctraigabome9600.skzfzqcdfx-08b.workers.dev';

  let active = 'feed';
  let data = { feed: [], med: [] };
  let loading = true;
  let cloudReady = false;
  let saveTimer = null;
  let localSaveTimer = null;
  let toastTimer = null;
  let saving = { feed: false, med: false };
  let saveAgain = { feed: false, med: false };

  try {
    const old = JSON.parse(
      localStorage.getItem(KEY) ||
      localStorage.getItem('so_nhap_cam_thuoc_minimal_v3') ||
      'null'
    );
    if (old && Array.isArray(old.feed) && Array.isArray(old.med)) {
      data = old;
    }
  } catch (e) {}

  const today = () => {
    const d = new Date();
    return d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  };

  const displayDate = v => {
    if (!v) return '';
    const a = v.split('-');
    return a.length === 3 ? `${a[2]}-${a[1]}-${a[0]}` : v;
  };

  function notify(message, ok = true) {
    const t = $('toast');
    t.textContent = message;
    t.classList.toggle('error', !ok);
    t.classList.remove('hidden');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.add('hidden'), 4200);
  }

  function blank(kind, date = today()) {
    return kind === 'feed'
      ? { date, name: '', type: '', qty: '' }
      : { date, name: '', unit: '', qty: '' };
  }

  function hasContent(row) {
    return !!(row.name || row.type || row.unit || row.qty);
  }

  
  // Lưu nháp bằng IndexedDB, không dùng localStorage để ghi dữ liệu.
  const DB_NAME = 'so_nhap_cam_thuoc_db';
  const DB_STORE = 'drafts';
  const DB_VERSION = 1;

  let dbPromise = null;

  function openDraftDB() {
    if (dbPromise) return dbPromise;

    dbPromise = new Promise((resolve, reject) => {
      if (!window.indexedDB) {
        reject(new Error('Trình duyệt không hỗ trợ IndexedDB'));
        return;
      }

      const request = indexedDB.open(DB_NAME, DB_VERSION);

      request.onupgradeneeded = () => {
        const db = request.result;
        if (!db.objectStoreNames.contains(DB_STORE)) {
          db.createObjectStore(DB_STORE);
        }
      };

      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(
        request.error || new Error('Không mở được kho dữ liệu')
      );
      request.onblocked = () => reject(
        new Error('Kho dữ liệu đang bị chặn')
      );
    });

    return dbPromise;
  }

  async function readDraftDB() {
    const db = await openDraftDB();

    return new Promise((resolve, reject) => {
      const tx = db.transaction(DB_STORE, 'readonly');
      const request = tx.objectStore(DB_STORE).get('main');

      request.onsuccess = () => resolve(request.result || null);
      request.onerror = () => reject(
        request.error || new Error('Không đọc được bản nháp')
      );
    });
  }

  async function writeDraftDB(snapshot) {
    const db = await openDraftDB();

    return new Promise((resolve, reject) => {
      const tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).put(snapshot, 'main');

      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(
        tx.error || new Error('Không ghi được bản nháp')
      );
      tx.onabort = () => reject(
        tx.error || new Error('Lưu bản nháp bị hủy')
      );
    });
  }

  async function localSave() {
    try {
      const snapshot = JSON.parse(JSON.stringify(data));
      await writeDraftDB(snapshot);
      return true;
    } catch (e) {
      console.error('Lỗi lưu nháp:', e);
      notify('Lỗi lưu nháp trên điện thoại: ' + e.message, false);
      return false;
    }
  }

  // Đọc bản nháp mới trước; nếu chưa có thì giữ dữ liệu cũ
  // đã đọc từ localStorage ở đầu chương trình.
  async function initializeDraft() {
    try {
      const saved = await readDraftDB();

      if (saved &&
          Array.isArray(saved.feed) &&
          Array.isArray(saved.med)) {
        data = saved;
      } else {
        // Chưa có bản nháp IndexedDB: chuyển dữ liệu cũ sang.
        await writeDraftDB(
          JSON.parse(JSON.stringify(data))
        );
      }
    } catch (e) {
      console.error('Không khởi tạo được IndexedDB:', e);
      notify(
        'Không mở được kho lưu nháp. Dữ liệu cũ vẫn được giữ trong phiên này; đừng đóng trang trước khi xử lý lỗi.',
        false
      );
    }
  }

  
  function scheduleLocalSave() {
    // Chỉ lưu nháp trên điện thoại, có debounce để tránh ghi IndexedDB
    // sau mỗi ký tự người dùng nhập.
    clearTimeout(localSaveTimer);
    localSaveTimer = setTimeout(() => {
      localSave();
    }, 400);
  }

  async function cloudSave(kind = active, manual = true) {
    if (loading || !cloudReady) {
      if (manual) notify('Đang tải dữ liệu, chờ một chút nhé.');
      return;
    }

    if (saving[kind]) {
      saveAgain[kind] = true;
      return;
    }

    saving[kind] = true;

    if (manual) {
      $('saveCloudBtn').disabled = true;
      $('saveCloudBtn').textContent = 'Đang lưu…';
    }

    try {
      const payload = JSON.stringify({
        type: kind,
        data: data[kind]
      });

      const res = await fetch(WORKER_URL + '/api/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: payload
      });

      const out = await res.json().catch(() => ({}));

      if (!res.ok || !out.success) {
        throw new Error(out.error || out.message || 'HTTP ' + res.status);
      }

      if (manual) {
        notify('Đã lưu dữ liệu ' +
          (kind === 'feed' ? 'nhập cám' : 'nhập thuốc') +
          ' lên Cloudflare.');
        $('menuPanel').classList.add('hidden');
      }
    } catch (e) {
      if (manual) {
        notify('Lưu thất bại: ' + e.message, false);
      } else {
        console.error('Cloud save failed:', e);
      }
    } finally {
      saving[kind] = false;

      if (manual) {
        $('saveCloudBtn').disabled = false;
        updateMenuLabels();
      }

      if (saveAgain[kind]) {
        saveAgain[kind] = false;
        setTimeout(() => cloudSave(kind, false), 300);
      }
    }
  }

  async function cloudLoad(kind) {
    const res = await fetch(
      WORKER_URL + '/api/load?type=' + encodeURIComponent(kind),
      { method: 'GET', cache: 'no-store' }
    );

    const out = await res.json().catch(() => ({}));

    if (!res.ok || !out.success || !Array.isArray(out.data)) {
      throw new Error(out.error || out.message || 'Không tải được dữ liệu.');
    }

    return out.data;
  }

  async function startupSync() {
    loading = true;
    cloudReady = false;
    const main = document.querySelector('main');
    main.classList.add('busy');
    main.inert = true;
    main.setAttribute('aria-busy', 'true');
    let syncSucceeded = false;

    const localData = {
      feed: data.feed.map(r => ({ ...r })),
      med: data.med.map(r => ({ ...r }))
    };

    try {
      const results = await Promise.allSettled([
        cloudLoad('feed'),
        cloudLoad('med')
      ]);

      let cloudAvailable = true;

      for (const result of results) {
        if (result.status === 'rejected') cloudAvailable = false;
      }

      if (!cloudAvailable) {
        // Không ghi đè dữ liệu máy chủ nếu chưa tải được.
        data = localData;
        render('feed');
        render('med');
        localSave();
        notify('Chưa kết nối được Cloudflare. Dữ liệu trên máy vẫn được giữ.', false);
        return;
      }

      const cloudFeed = results[0].value;
      const cloudMed = results[1].value;

      // Nếu máy chủ đã có dữ liệu, lấy dữ liệu trên máy chủ.
      // Nếu máy chủ chưa có dữ liệu, giữ dữ liệu cũ trên máy và tải lên.
      data.feed = cloudFeed.length
        ? cloudFeed
        : (localData.feed.length ? localData.feed : [blank('feed')]);

      data.med = cloudMed.length
        ? cloudMed
        : (localData.med.length ? localData.med : [blank('med')]);

      render('feed');
      render('med');
      localSave();

      cloudReady = true;

      if (!cloudFeed.length && localData.feed.some(hasContent)) {
        await cloudSave('feed', false);
      }

      if (!cloudMed.length && localData.med.some(hasContent)) {
        await cloudSave('med', false);
      }

      syncSucceeded = true;
     
    } catch (e) {
      data = localData;
      render('feed');
      render('med');
      localSave();
      notify('Lỗi đồng bộ: ' + e.message, false);
    } finally {
      loading = false;
      cloudReady = syncSucceeded;
      main.classList.remove('busy');
      main.inert = false;
      main.removeAttribute('aria-busy');
      updateMenuLabels();
    }
  }

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;',
      '"': '&quot;', "'": '&#39;'
    })[c]);
  }

  function addRow(kind, index, newDay = false) {
    const scrollX = window.scrollX;
    const scrollY = window.scrollY;
    const prev = data[kind][index];
    let date = prev?.date || today();

    if (newDay) {
      const d = new Date(date + 'T12:00:00');
      d.setDate(d.getDate() + 1);
      date = d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0');
    }

    data[kind].splice(index + 1, 0, blank(kind, date));
    render(kind);
    scheduleLocalSave();

    const keepPosition = () =>
      window.scrollTo({ left: scrollX, top: scrollY, behavior: 'instant' });

    keepPosition();
    requestAnimationFrame(() => {
      keepPosition();
      requestAnimationFrame(keepPosition);
    });
    setTimeout(keepPosition, 100);
  }

  
function makeRow(kind, row, index) {
  const tr = document.createElement('tr');

  const opts = kind === 'feed'
    ? []
    : [
        'Kg', 'Lít', 'Gói', 'Lọ', '100 doses', '200 doses',
        '500 doses', '1.000 doses', '2.000 doses',
        '2.500 doses', '4.000 doses', '5.000 doses',
        '8.000 doses', '10.000 doses'
      ];

  const feedTypes = [
  'Gà Đẻ',
  'Gà Trống',
  'Giai Đoạn 1',
  'Giai Đoạn 2',
  'Giai Đoạn 3'
];

const fieldHtml = kind === 'feed'
  ? `<select data-k="type" aria-label="Loại cám">
       <option value="">Chọn loại cám</option>
       ${feedTypes.map(x =>
         `<option value="${esc(x)}"
           ${row.type === x ? 'selected' : ''}>${esc(x)}</option>`
       ).join('')}
     </select>`
  : `<select data-k="unit" aria-label="Quy cách đóng gói">
       <option value="">Chọn</option>
       ${opts.map(x =>
         `<option value="${esc(x)}"
           ${row.unit === x ? 'selected' : ''}>${esc(x)}</option>`
       ).join('')}
     </select>`;
  const dateValue = row.date || today();

  tr.innerHTML = `
    <td class="stt-cell"><span class="stt-number"></span></td>
    <td class="date-cell">
      <span class="date-display">${esc(displayDate(dateValue))}</span>
      <input type="date" data-date-input aria-label="Ngày nhập"
        value="${esc(dateValue)}">
    </td>
    <td class="name">
      <input type="text" data-k="name"
        aria-label="${kind === 'feed' ? 'Tên cám' : 'Tên thuốc'}"
        value="${esc(row.name || '')}" autocomplete="off">
    </td>
  ${kind === 'med' ? `
  <td>
    <input type="text" data-k="qty" inputmode="text"
      aria-label="Số lượng" value="${esc(row.qty ?? '')}"
      placeholder="0" autocomplete="off">
  </td>
  <td>${fieldHtml}</td>
` : `
  <td>${fieldHtml}</td>
  <td>
    <input type="text" data-k="qty" inputmode="text"
      aria-label="Số lượng" value="${esc(row.qty ?? '')}"
      placeholder="0" autocomplete="off">
  </td>
`}`;

  const dateInput = tr.querySelector('[data-date-input]');

  dateInput.addEventListener('change', () => {
    if (!dateInput.value) return;

    row.date = dateInput.value;
    render(kind);
    scheduleLocalSave();
  });

  tr.querySelectorAll('[data-k]').forEach(el => {
    
const update = () => {
  row[el.dataset.k] = el.value;

  scheduleLocalSave();

  if (kind === 'feed' && el.dataset.k === 'qty') {
    updateFeedTotal();
  }
};


    // Chỉ gắn mỗi sự kiện một lần
    el.addEventListener('input', update);
    el.addEventListener('change', update);

    el.addEventListener('keydown', ev => {
      if (
        (ev.key === 'Delete' || ev.key === 'Backspace') &&
        !el.value &&
        !hasContent(row) &&
        data[kind].length > 1
      ) {
        ev.preventDefault();

        data[kind].splice(index, 1);
        render(kind);
        scheduleLocalSave();

        const target = $(kind + 'Rows').children[
          Math.min(index, $(kind + 'Rows').children.length - 1)
        ];

        target?.querySelector('[data-k="name"]')?.focus();
        return;
      }

      if (ev.key === 'Enter' || ev.key === 'ArrowDown') {
        ev.preventDefault();
        addRow(kind, index, el.dataset.k === 'qty');
      }
    });
  });

  return tr;
}



function parseFeedQty(raw) {
  let value = String(raw ?? '')
    .trim()
    .replace(/\s/g, '')
    .replace(/bao/gi, '');

  if (!value) return 0;

  if (/^\d{1,3}([.,]\d{3})+$/.test(value)) {
    value = value.replace(/[.,]/g, '');
  } else {
    value = value.replace(',', '.');
  }

  const number = Number(value);
  return Number.isFinite(number) ? number : 0;
}

function updateFeedTotal() {
  const body = $('feedRows');
  if (!body) return;

  const totals = {};

  data.feed.forEach(row => {
    const type = String(row.type || '').trim();
    const qty = parseFeedQty(row.qty);

    // Chỉ hiện loại cám đã có số lượng lớn hơn 0
    if (type && qty > 0) {
      totals[type] = (totals[type] || 0) + qty;
    }
  });

  let summary = body.querySelector('#feedTypeSummary');

  if (!summary) {
    summary = document.createElement('tr');
    summary.id = 'feedTypeSummary';
    summary.innerHTML = `
      <td colspan="5" style="padding:0;background:#fff;border:1px solid #236747">
        <table style="width:100%;border-collapse:collapse;table-layout:fixed;font-size:12px">
          <thead>
            <tr>
              <th colspan="2" style="background:#18583c;color:white;padding:9px;font-size:13px">
                TỔNG SỐ LƯỢNG THEO LOẠI CÁM
              </th>
            </tr>
          </thead>
          <tbody id="feedTypeSummaryRows"></tbody>
        </table>
      </td>
    `;
    body.appendChild(summary);
  }

  const rows = summary.querySelector('#feedTypeSummaryRows');
  rows.innerHTML = '';

  const types = [
    'Gà Đẻ',
    'Gà Trống',
    'Giai Đoạn 1',
    'Giai Đoạn 2',
    'Giai Đoạn 3'
  ];

  let grandTotal = 0;

  types.forEach(type => {
    const total = totals[type] || 0;

    // Loại nào chưa có số lượng thì không hiển thị
    if (total <= 0) return;

    grandTotal += total;

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="width:60%;padding:8px 5px;text-align:left;font-weight:700;color:#18583c;background:#e3f2e8">
        ${type}
      </td>
      <td style="padding:8px 5px;font-weight:900;background:#f5faf6">
        ${total.toLocaleString('vi-VN')} bao
      </td>
    `;
    rows.appendChild(tr);
  });

  if (grandTotal > 0) {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="padding:9px 5px;font-weight:900;background:#d1e8d8">
        TỔNG CỘNG
      </td>
      <td style="padding:9px 5px;font-weight:900;color:#18583c;background:#d1e8d8">
        ${grandTotal.toLocaleString('vi-VN')} bao
      </td>
    `;
    rows.appendChild(tr);
  } else {
    summary.remove();
  }
}

  function render(kind) {
    const body = $(kind + 'Rows');
    body.innerHTML = '';

    if (!data[kind].length) data[kind].push(blank(kind));

    let lastDate = null;
    let stt = 0;

    data[kind].forEach((row, i) => {
      if (!row.date) row.date = today();

      const isStart = row.date !== lastDate;
      if (isStart) {
        stt++;
        lastDate = row.date;
      }

      const tr = makeRow(kind, row, i);
      const sttCell = tr.querySelector('.stt-cell');
      const dateCell = tr.querySelector('.date-cell');

      if (isStart) {
        let span = 1;

        for (let j = i + 1; j < data[kind].length; j++) {
          if ((data[kind][j].date || today()) !== row.date) break;
          span++;
        }

        sttCell.rowSpan = span;
        dateCell.rowSpan = span;
        sttCell.querySelector('.stt-number').textContent = stt;
      } else {
        sttCell.remove();
        dateCell.remove();
      }

      
      body.appendChild(tr);
    });

    if (kind === 'feed') {
  updateFeedTotal();
}
  }


  function updateMenuLabels() {
    const name = active === 'feed' ? 'cám' : 'thuốc';
    $('menuTitle').textContent = 'Công cụ nhập ' + name;
    $('saveCloudBtn').textContent =
      '☁️ Lưu dữ liệu nhập ' + name + ' lên máy chủ';
    $('loadCloudBtn').textContent =
      '↻ Tải dữ liệu nhập ' + name + ' từ máy chủ';
  }

  function switchTo(kind) {
    active = kind;

    $('feedSheet').classList.toggle('hidden', kind !== 'feed');
    $('medSheet').classList.toggle('hidden', kind !== 'med');

    ['topFeed'].forEach(id => {
      $(id).classList.toggle('active', kind === 'feed');
      $(id).classList.toggle('feed', kind === 'feed');
      $(id).classList.toggle('med', false);
    });

    ['topMed'].forEach(id => {
      $(id).classList.toggle('active', kind === 'med');
      $(id).classList.toggle('med', kind === 'med');
      $(id).classList.toggle('feed', false);
    });

    updateMenuLabels();
  }

  $('topFeed').onclick = () => switchTo('feed');
  $('topMed').onclick = () => switchTo('med');

  $('menuBtn').addEventListener('click', () => {
    updateMenuLabels();
    $('menuPanel').classList.remove('hidden');
  });

  $('closeMenuBtn').addEventListener('click', () =>
    $('menuPanel').classList.add('hidden')
  );

  $('menuPanel').addEventListener('click', ev => {
    if (ev.target === $('menuPanel')) {
      $('menuPanel').classList.add('hidden');
    }
  });

  $('saveCloudBtn').addEventListener('click', () =>
    cloudSave(active, true)
  );

  $('loadCloudBtn').addEventListener('click', async () => {
    if (!confirm(
      'Tải dữ liệu từ Cloudflare sẽ thay thế dữ liệu hiện có trong tab này. Tiếp tục?'
    )) return;

    const kind = active;
    $('loadCloudBtn').disabled = true;
    $('loadCloudBtn').textContent = 'Đang tải…';

    try {
      const remote = await cloudLoad(kind);
      data[kind] = remote.length ? remote : [blank(kind)];
      render(kind);
      localSave();
      $('menuPanel').classList.add('hidden');
      notify('Đã tải dữ liệu từ Cloudflare.');
    } catch (e) {
      notify('Tải dữ liệu thất bại: ' + e.message, false);
    } finally {
      $('loadCloudBtn').disabled = false;
      updateMenuLabels();
    }
  });

  async function exportPdf() {
    const kind = active;
    const btn = $('exportPdfBtn');
    const sheet = $(kind + 'Sheet');
    let clone;

    btn.disabled = true;
    btn.textContent = 'Đang tạo PDF độ nét cao…';

    try {
      if (!window.html2canvas || !window.jspdf) {
        throw new Error('Không tải được thư viện PDF. Kiểm tra mạng rồi thử lại.');
      }

      clone = sheet.cloneNode(true);
      clone.classList.remove('hidden');
      clone.style.cssText +=
        ';position:fixed;left:-12000px;top:0;width:1100px;max-width:none;overflow:visible;border-radius:0;';

      clone.querySelectorAll('input,select').forEach(el => {
        const span = document.createElement('span');
        span.textContent = el.matches('[data-date-input]')
          ? displayDate(el.value)
          : (el.value || '');

        span.style.cssText =
          'display:block;min-height:30px;padding:5px 3px;font:16px Arial;color:#24352b;white-space:pre-wrap;overflow-wrap:anywhere;text-align:center;';

        if (el.closest('td.name')) span.style.textAlign = 'left';
        el.replaceWith(span);
      });

      document.body.appendChild(clone);

      const canvas = await html2canvas(clone, {
        scale: 3,
        backgroundColor: '#ffffff',
        useCORS: true,
        logging: false,
        windowWidth: 1200
      });

      clone.remove();
      clone = null;

      const img = canvas.toDataURL('image/jpeg', 0.98);
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({
        orientation: 'landscape',
        unit: 'mm',
        format: 'a4',
        compress: true
      });

      const margin = 8;
      const ratio = Math.min(
        (297 - margin * 2) / canvas.width,
        (210 - margin * 2) / canvas.height
      );
      const w = canvas.width * ratio;
      const h = canvas.height * ratio;

      pdf.addImage(img, 'JPEG', (297 - w) / 2, (210 - h) / 2, w, h);

      const blob = pdf.output('blob');
      const file = new File(
        [blob],
        (kind === 'feed' ? 'Nhap-cam-' : 'Nhap-thuoc-') + today() + '.pdf',
        { type: 'application/pdf' }
      );

      $('menuPanel').classList.add('hidden');

      if (navigator.share && navigator.canShare &&
          navigator.canShare({ files: [file] })) {
        await navigator.share({
          files: [file],
          title: kind === 'feed' ? 'Dữ liệu nhập cám' : 'Dữ liệu nhập thuốc'
        });
        notify('Đã tạo PDF.');
      } else {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = file.name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 60000);
        notify('Đã xuất PDF.');
      }
    } catch (e) {
      if (e.name === 'AbortError') {
        notify('Đã đóng bảng chia sẻ PDF.');
      } else {
        notify('Xuất PDF thất bại: ' + e.message, false);
      }
    } finally {
      if (clone) clone.remove();
      btn.disabled = false;
      btn.textContent = '📄 Xuất PDF độ nét cao và chia sẻ';
    }
  }

  $('exportPdfBtn').addEventListener('click', exportPdf);

  
  
  // Mở trang: đọc bản nháp trước, sau đó đồng bộ bằng một luồng duy nhất.
  (async () => {
    await initializeDraft();

    if (!data.feed.length) data.feed.push(blank('feed'));
    if (!data.med.length) data.med.push(blank('med'));

    render('feed');
    render('med');
    switchTo('feed');
    await startupSync();
  })();


})();
</script>
